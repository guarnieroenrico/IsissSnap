<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISISS Matese · Photo Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fffaf3;--surface:#ffffff;--ink:#1f1b3d;--muted:#6a6585;--line:#eadfce;
  --orange:#ff7a1a;--yellow:#ffc400;--lime:#8bd400;--green:#00b97a;--cyan:#00a6e0;--pink:#e6007e;
  --head:"Baloo 2","Trebuchet MS",sans-serif;--body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15122b;--surface:#211d40;--ink:#fff6ea;--muted:#b4aed4;--line:#362f63;color-scheme:dark}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.5 var(--body);min-height:100vh}
header{display:flex;align-items:center;gap:1rem;max-width:900px;margin:0 auto;padding:1.2rem 1rem .4rem}
header img{width:64px;height:auto}
h1{font:800 clamp(1.6rem,5vw,2.4rem)/1 var(--head);margin:0}
header p{margin:.2rem 0 0;color:var(--muted);font-size:.95rem}
main{max-width:900px;margin:0 auto;padding:.6rem 1rem 2.5rem}

/* Cornice: i colori dei tre indirizzi nel logo */
.frame{padding:7px;border-radius:30px;background:conic-gradient(from 20deg,var(--orange),var(--pink),var(--cyan),var(--green),var(--yellow),var(--orange))}
.stage{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:#111;display:grid;place-items:center}
video,#still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video.mirror{transform:scaleX(-1)}
#still{display:none}
.badge{position:absolute;left:12px;bottom:12px;display:none;align-items:center;gap:8px;background:rgba(255,255,255,.92);color:#1f1b3d;padding:5px 12px 5px 6px;border-radius:99px;font:800 .95rem var(--head)}
.badge img{width:28px}
.stage.framed .badge{display:flex}
.msg{position:relative;z-index:1;text-align:center;color:#fff;padding:1.5rem;max-width:30ch}
.msg button{margin-top:.8rem}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .35s ease-out}
@keyframes fl{from{opacity:.9}to{opacity:0}}

.filters{display:flex;gap:.5rem;overflow-x:auto;padding:1rem .2rem .4rem;scrollbar-width:thin}
.chip{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:.45rem 1rem;font:700 .95rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--c,var(--orange));background:var(--c,var(--orange));color:#fff}
.chip small{opacity:.8;font-weight:600;margin-left:.3rem}

.bar{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:.8rem;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer}
.shot{width:78px;height:78px;border-radius:50%;border:6px solid var(--surface);outline:4px solid var(--pink);background:var(--pink);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.shot:active{transform:translateY(2px)}
.btn{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:.6rem 1rem;font:700 .95rem var(--body)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

h2{font:800 1.4rem var(--head);margin:2rem 0 .6rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.gallery figure{margin:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.gallery img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.gallery figcaption{display:flex;justify-content:space-between;align-items:center;padding:.4rem .6rem;font-size:.85rem;color:var(--muted)}
.gallery a{color:var(--ink);font-weight:700}
.empty{color:var(--muted);margin:0}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 1rem 2rem}
@media (prefers-reduced-motion:reduce){#flash.go{animation:none}}
</style>
</head>

const logoImg=new Image();logoImg.src=$("logo").src;

// Filtri
FILTERS.forEach((f,i)=>{
  const b=document.createElement("button");
  b.className="chip";b.style.setProperty("--c",f.c);
  b.setAttribute("aria-pressed",i===0);
  b.innerHTML=f.n+(f.t?"<small>"+f.t+"</small>":"");
  b.onclick=()=>{cur=f;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));applyLive()};
  $("filters").appendChild(b);
});
function applyLive(){video.style.filter=still.style.filter=cur.s}

// Fotocamera
async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false});
    video.srcObject=stream;
    video.classList.toggle("mirror",facing==="user");
    msg.style.display="none";
  }catch(e){
    msg.querySelector("p").textContent="Non riesco ad aprire la fotocamera. Controlla i permessi del browser oppure usa una foto dalla galleria.";
    msg.style.display="";$("start").textContent="Riprova";
  }
}
$("start").onclick=startCam;
$("flip").onclick=()=>{facing=facing==="user"?"environment":"user";if(!usingUpload)startCam()};

// Cornice
$("frameBtn").onclick=e=>{
  framed=!framed;stage.classList.toggle("framed",framed);
  e.target.setAttribute("aria-pressed",framed);e.target.textContent="Cornice scuola: "+(framed?"sì":"no");
};

// Foto da galleria
$("upload").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{uploadImg=img;usingUpload=true;still.src=img.src;still.style.display="block";
    video.style.display="none";msg.style.display="none";$("back").hidden=false;applyLive()};
  img.src=URL.createObjectURL(f);e.target.value="";
};
$("back").onclick=()=>{usingUpload=false;uploadImg=null;still.style.display="none";video.style.display="";$("back").hidden=true;
  if(!stream)msg.style.display=""};

// Scatto
$("snap").onclick=()=>{
  const src=usingUpload?uploadImg:video;
  const w=usingUpload?uploadImg.naturalWidth:video.videoWidth,h=usingUpload?uploadImg.naturalHeight:video.videoHeight;
  if(!w){msg.style.display="";return}
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;
  const ctx=cv.getContext("2d");
  ctx.filter=cur.s;
  if(!usingUpload&&facing==="user"){ctx.translate(w,0);ctx.scale(-1,1)}
  ctx.drawImage(src,0,0,w,h);
  ctx.setTransform(1,0,0,1,0,0);ctx.filter="none";
  if(framed){
    const u=Math.max(w,h)/900;
    const g=ctx.createConicGradient(0.35,w/2,h/2);
    ["#ff7a1a","#e6007e","#00a6e0","#00b97a","#ffc400","#ff7a1a"].forEach((c,i)=>g.addColorStop(i/5,c));
    ctx.strokeStyle=g;ctx.lineWidth=26*u;ctx.strokeRect(13*u,13*u,w-26*u,h-26*u);
    const bh=88*u;
    ctx.fillStyle="rgba(255,255,255,.92)";
    ctx.beginPath();ctx.roundRect(40*u,h-bh-40*u,330*u,bh,bh/2);ctx.fill();
    const lh=bh-16*u;ctx.drawImage(logoImg,52*u,h-bh-40*u+8*u,lh*logoImg.width/logoImg.height,lh);
    ctx.fillStyle="#1f1b3d";ctx.font="800 "+34*u+"px 'Baloo 2',sans-serif";ctx.textBaseline="middle";
    ctx.fillText("ISISS Matese",52*u+lh*0.82+14*u,h-bh/2-40*u+2*u);
  }
  $("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go");
  addPhoto(cv.toDataURL("image/jpeg",.92));
};

function addPhoto(url){
  $("empty")?.remove();count++;
  const fig=document.createElement("figure");
  fig.innerHTML='<img alt="Foto '+count+'" src="'+url+'"><figcaption><span>'+cur.n+'</span><a href="'+url+'" download="matese-photo-'+count+'.jpg">Scarica</a></figcaption>';
  $("gallery").prepend(fig);
}

// Prova ad avviare subito se il permesso è già concesso
if(navigator.permissions&&navigator.permissions.query){
  navigator.permissions.query({name:"camera"}).then(p=>{if(p.state==="granted")startCam()}).catch(()=>{});
}
</script>
</body>
</html>
